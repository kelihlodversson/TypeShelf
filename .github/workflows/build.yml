name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the unit tests
        run: make test

  m68k:
    name: Build TYPESHLF.PRG (m68k)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-ptos
        with:
          target: m68k
      - name: Build
        run: make
      - name: Check that it is a GEMDOS program
        run: |
          test "$(od -A n -t x1 -N 2 build/m68k/TYPESHLF.PRG | tr -d ' ')" = 601a
      - uses: actions/upload-artifact@v4
        with:
          name: TypeShelf-m68k
          path: |
            build/m68k/TYPESHLF.PRG
            build/m68k/TYPESHLF.RSC

  arm:
    name: Build for ARM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-ptos
        with:
          target: arm
      - name: Build
        run: make arm
      - name: Check the ARM executable ABI
        run: |
          readelf -h build/arm/TYPESHLF.PRG | grep 'ELF32'
          readelf -h build/arm/TYPESHLF.PRG | grep 'ARM'
          readelf -A build/arm/TYPESHLF.PRG | grep 'Tag_ABI_VFP_args: VFP registers'
      - uses: actions/upload-artifact@v4
        with:
          name: TypeShelf-arm
          path: |
            build/arm/TYPESHLF.PRG
            build/arm/TYPESHLF.RSC

  x32:
    name: Build for pTOS x32
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: kelihlodversson/pTOS
          ref: 41e77f9d8bd1215207c511ebb318ada3eb1d6018
          path: build/ptos
          submodules: recursive
      - uses: ./.github/actions/setup-ptos
        with:
          target: x32
      - name: Install emulator tools
        run: sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools
      - name: Build the pTOS shared runtime
        working-directory: build/ptos
        run: |
          make pc-x86_64-desktop-tests-builtin-cli_defconfig
          make CROSS_COMPILE="$X32_PREFIX" X32_CROSS_COMPILE="$X32_PREFIX" -j4
          make CROSS_COMPILE="$X32_PREFIX" X32_CROSS_COMPILE="$X32_PREFIX" -j4 x32-desktop-test
      - name: Check that the runtime uses external libaes
        working-directory: build/ptos
        run: |
          grep -qx 'CONF_WITH_LIBAES=y' .config
          grep -qx '#define CONF_WITH_AES 0' obj/autoconf.h
          readelf -d emudesk.prg | grep 'Shared library: \[libaes.so\]'
          nm emutos.efi > obj/kernel.symbols
          if grep -Eq ' [Tt] (ui_start|aes_service|aes_tree_validate)$' obj/kernel.symbols; then
            echo 'The x32 runtime must not link kernel AES services' >&2
            exit 1
          fi
      - name: Build TypeShelf
        run: |
          make test-x32-adapter
          make -j4 x32 PTOS=build/ptos
      - name: Check the executable and shared library dependencies
        run: |
          readelf -h build/x32/TYPESHLF.PRG | grep 'ELF32'
          readelf -h build/x32/TYPESHLF.PRG | grep 'Advanced Micro Devices X86-64'
          readelf -l build/x32/TYPESHLF.PRG | grep '/GEMSYS/LIB/X32/LD.SO'
          readelf -d build/x32/TYPESHLF.PRG | grep 'Shared library: \[libaes.so\]'
          readelf -d build/x32/TYPESHLF.PRG | grep 'Shared library: \[libptos.so\]'
          python3 tools/mkrsc.py --check build/x32/TYPESHLF.RSC
          python3 build/ptos/tools/check-libaes-elf.py \
            build/ptos/obj/libaes/libaes.so build/ptos/obj/gemlib/libgem.a \
            build/x32/TYPESHLF.PRG
      - name: Exercise TypeShelf on the native desktop
        run: |
          python3 tests/emulator/x32.py --ptos build/ptos \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd
      - uses: actions/upload-artifact@v4
        with:
          name: TypeShelf-x32
          path: |
            build/x32/TYPESHLF.PRG
            build/x32/TYPESHLF.RSC
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TypeShelf-x32-gui-test
          path: build/emulator/x32/
