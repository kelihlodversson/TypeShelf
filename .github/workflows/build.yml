name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the unit tests
        run: make test

  m68k:
    name: Build TYPESHLF.PRG (m68k)
    # the mintelf PPA has packages for this release; ubuntu-latest may not
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the m68k toolchain
        run: |
          sudo add-apt-repository -y ppa:vriviere/mintelf
          sudo apt-get update -qq
          sudo apt-get install -y cross-mintelf-essential
          pip3 install kconfiglib
      - name: Build
        run: make
      - name: Check that it is a GEMDOS program
        run: |
          test "$(od -A n -t x1 -N 2 build/m68k/TYPESHLF.PRG | tr -d ' ')" = 601a
      - uses: actions/upload-artifact@v4
        with:
          name: TypeShelf-m68k
          path: |
            build/m68k/TYPESHLF.PRG
            build/m68k/TYPESHLF.RSC

  arm:
    name: Build for ARM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi
          pip3 install kconfiglib
      - name: Build
        run: make arm
      - uses: actions/upload-artifact@v4
        with:
          name: TypeShelf-arm
          path: |
            build/arm/TYPESHLF.PRG
            build/arm/TYPESHLF.RSC

  x32:
    name: Build for pTOS x32
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: kelihlodversson/pTOS
          ref: 7a17e6328d7f37b75592ee14cb29a0804480342c
          path: build/ptos
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc binutils rsync python3-venv
          python3 -m venv build/venv
          build/venv/bin/pip install kconfiglib
      - name: Build the pTOS shared runtime
        working-directory: build/ptos
        run: |
          export PATH="$GITHUB_WORKSPACE/build/venv/bin:$PATH"
          make pc-x86_64-desktop-tests-builtin-cli_defconfig
          CONFIG_= python3 - <<'PYCONFIG'
          import kconfiglib
          config = kconfiglib.Kconfig()
          config.load_config()
          config.syms['CONF_WITH_ELF_SHARED'].set_value(2)
          config.syms['CONF_WITH_LIBAES'].set_value(2)
          config.write_config()
          PYCONFIG
          make CROSS_COMPILE= -j4
      - name: Build TypeShelf
        run: |
          export PATH="$GITHUB_WORKSPACE/build/venv/bin:$PATH"
          make -j4 x32 PTOS=build/ptos
      - name: Check the executable and shared library dependencies
        run: |
          readelf -h build/x32/TYPESHLF.PRG | grep 'ELF32'
          readelf -h build/x32/TYPESHLF.PRG | grep 'Advanced Micro Devices X86-64'
          readelf -l build/x32/TYPESHLF.PRG | grep '/GEMSYS/LIB/X32/LD.SO'
          readelf -d build/x32/TYPESHLF.PRG | grep 'Shared library: \[libaes.so\]'
          readelf -d build/x32/TYPESHLF.PRG | grep 'Shared library: \[libptos.so\]'
          python3 tools/mkrsc.py --check build/x32/TYPESHLF.RSC
      - uses: actions/upload-artifact@v4
        with:
          name: TypeShelf-x32
          path: |
            build/x32/TYPESHLF.PRG
            build/x32/TYPESHLF.RSC
