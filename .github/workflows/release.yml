name: Release

# Started by hand: Actions > Release > Run workflow, with the version
# ("1.2.3", no leading v).  It builds Type Shelf for m68k and ARM with that
# version in About, tags the commit it ran on "v1.2.3" and publishes a GitHub
# release with a zip per platform; the notes are generated from the merged pull
# requests since the last release (categories: .github/release.yml).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, such as 1.2.3 or 1.2.3-rc.1, at most 24 characters (the tag is v + this)"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - name: The version is well formed and not released yet
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1.2.3, or 1.2.3-rc.1: three numbers and an optional suffix of letters, digits and dots
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "::error::version '$VERSION' is not like 1.2.3 or 1.2.3-rc.1"; exit 1
          fi
          # what About has room for ("Type Shelf " and the version in 36 characters)
          if [ "${#VERSION}" -gt 24 ]; then
            echo "::error::version '$VERSION' is longer than 24 characters"; exit 1
          fi
          if ! git check-ref-format "refs/tags/v$VERSION"; then
            echo "::error::v$VERSION is not a valid tag name"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::the tag v$VERSION exists already"; exit 1
          fi

  test:
    name: Host unit tests
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test VERSION=${{ inputs.version }}

  m68k:
    name: Build for m68k
    needs: check
    # the mintelf PPA has packages for this release; ubuntu-latest may not
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the m68k toolchain
        run: |
          sudo add-apt-repository -y ppa:vriviere/mintelf
          sudo apt-get update -qq
          sudo apt-get install -y cross-mintelf-essential
          pip3 install kconfiglib
      - name: Build
        run: make VERSION=${{ inputs.version }}
      - name: Check that it is a GEMDOS program with the version in it
        run: |
          test "$(od -A n -t x1 -N 2 build/m68k/TYPESHLF.PRG | tr -d ' ')" = 601a
          grep -q -a "${{ inputs.version }}" build/m68k/TYPESHLF.PRG
      - name: Zip
        run: |
          name=TypeShelf-${{ inputs.version }}-m68k
          mkdir "$name"
          cp build/m68k/TYPESHLF.PRG build/m68k/TYPESHLF.RSC README.md LICENSE "$name"/
          zip -r "$name.zip" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: zip-m68k
          path: TypeShelf-*-m68k.zip

  arm:
    name: Build for ARM
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi
          pip3 install kconfiglib
      - name: Build
        run: make arm VERSION=${{ inputs.version }}
      - name: Check that the version is in it
        run: grep -q -a "${{ inputs.version }}" build/arm/TYPESHLF.PRG
      - name: Zip
        run: |
          name=TypeShelf-${{ inputs.version }}-arm
          mkdir "$name"
          cp build/arm/TYPESHLF.PRG build/arm/TYPESHLF.RSC README.md LICENSE "$name"/
          zip -r "$name.zip" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: zip-arm
          path: TypeShelf-*-arm.zip

  release:
    name: Tag and publish
    needs: [test, m68k, arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write           # the tag and the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=
          if [ "$PRERELEASE" = true ]; then flags=--prerelease; fi
          # creates v$VERSION at the commit this run is for, and writes the
          # notes from the pull requests merged since the previous release
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Type Shelf $VERSION" \
            --generate-notes $flags \
            TypeShelf-"$VERSION"-m68k.zip TypeShelf-"$VERSION"-arm.zip
